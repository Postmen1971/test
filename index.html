<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071522">
<title>GigaBlue Receiver Manager</title>
<style>
:root{--bg:#071522;--card:#14283a;--muted:#a9bfd0;--text:#f5f8fb;--blue:#1598ff;--green:#20d879;--border:#29445b;--orange:#e7831d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh;padding-bottom:78px}.app{max-width:560px;margin:auto;padding:16px 14px 24px}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 18px}.brand{font-size:27px;font-weight:800;letter-spacing:2px}.sub{font-size:13px;color:#91a9bc;text-align:center;margin-top:-13px;margin-bottom:15px}.gear{font-size:27px}.connection{background:linear-gradient(135deg,#172d40,#102335);border:1px solid var(--border);border-radius:22px;padding:18px;margin-bottom:14px}.connrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.model{font-size:21px;font-weight:700}.small{color:var(--muted);font-size:15px;margin-top:4px}.status{font-size:18px;color:var(--green);font-weight:700}.ip{font-size:14px;color:var(--muted);margin-top:5px}.btn{border:1px solid #3b5870;background:#22394d;color:#fff;border-radius:14px;padding:11px 15px;font-size:15px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:142px;border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 25px rgba(0,0,0,.12)}.tile b{font-size:19px;line-height:1.15}.tile span{font-size:14px;line-height:1.35;opacity:.9}.blue{background:linear-gradient(145deg,#159cff,#0758ca)}.green{background:linear-gradient(145deg,#0fbd74,#087c55)}.purple{background:linear-gradient(145deg,#6256dc,#3e32a7)}.orange{background:linear-gradient(145deg,#ed8a20,#bc5a0d)}.cyan{background:linear-gradient(145deg,#079fc0,#08748e)}.slate{background:linear-gradient(145deg,#344b5e,#223545)}.icon{font-size:32px}.section{margin-top:18px;background:#102536;border:1px solid var(--border);border-radius:20px;padding:16px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:13px}.folders{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.folder{background:#1b3448;border:1px solid #315067;border-radius:14px;padding:13px}.folder strong{display:block;font-size:15px;margin-top:7px}.folder code{font-size:13px;color:#c7d7e4}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(7,21,34,.94);backdrop-filter:blur(18px);border-top:1px solid #29445b;display:flex;justify-content:center;z-index:5}.nav{width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{background:none;border:0;color:#9eb2c3;padding:10px 3px 9px;font-size:12px}.nav button.active{color:#24a5ff}.nav .ni{display:block;font-size:23px;margin-bottom:3px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;padding:20px}.modal.show{display:flex;align-items:flex-end}.sheet{background:#102536;border:1px solid #315067;border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:560px;margin:auto}.sheet h2{margin:0 0 16px}.input{width:100%;background:#091b2a;border:1px solid #355168;color:white;border-radius:12px;padding:13px;font-size:16px;margin-bottom:10px}.actions{display:flex;gap:10px}.actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#19364b;border:1px solid #40617a;padding:11px 16px;border-radius:14px;display:none;z-index:20;font-size:14px}.toast.show{display:block}@media(max-width:390px){.app{padding:12px 10px}.tile{min-height:132px;padding:14px 13px}.tile b{font-size:17px}.tile span{font-size:13px}.brand{font-size:23px}.connection{padding:15px}.grid{gap:9px}.folders{gap:8px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand">GIGABLUE</div><div class="gear">⚙️</div></header>
  <div class="sub">Receiver Manager</div>

  <section class="connection">
    <div class="connrow">
      <div><div class="model" id="receiverName">Trio 4K</div><div class="small" id="receiverVersion">OpenATV / Enigma2</div></div>
      <div style="text-align:right"><div class="status">● Verbunden</div><div class="ip" id="receiverIp">IP: nicht konfiguriert</div></div>
    </div>
    <button class="btn" style="margin-top:14px;width:100%" onclick="openSettings()">Verbindung ändern</button>
  </section>

  <section class="grid">
    <button class="tile blue" onclick="toast('Komplettes Backup wird vorbereitet…')"><div class="icon">⬇️</div><b>Komplettes<br>Backup</b><span>Wichtige Settings sichern</span></button>
    <button class="tile green" onclick="toast('Wiederherstellung geöffnet')"><div class="icon">⬆️</div><b>Backup<br>wiederherstellen</b><span>Settings auf die Box</span></button>
    <button class="tile purple" onclick="location.hash='files'"><div class="icon">📄</div><b>Dateimanager</b><span>Dateien anzeigen, sichern, übertragen</span></button>
    <button class="tile orange" onclick="toast('Dateiauswahl wird geöffnet…')"><div class="icon">☰</div><b>Einzelne Datei</b><span>Gezielt sichern oder übertragen</span></button>
    <button class="tile slate" onclick="toast('Bouquet-Verwaltung geöffnet')"><div class="icon">📋</div><b>Senderlisten</b><span>Bouquets sichern und wiederherstellen</span></button>
    <button class="tile cyan" onclick="toast('Neustart-Funktionen geöffnet')"><div class="icon">⚙️</div><b>Receiver<br>Neustarten</b><span>Enigma2 neu laden oder rebooten</span></button>
  </section>

  <section class="section" id="files">
    <div class="sectionhead"><h2>Schnellzugriff</h2><span class="muted">Wichtige Ordner</span></div>
    <div class="folders">
      <button class="folder" onclick="selectPath('/etc/enigma2')"><div class="icon">📁</div><strong>/etc/enigma2</strong><code>Settings &amp; Bouquets</code></button>
      <button class="folder" onclick="selectPath('/media/hdd')"><div class="icon">📁</div><strong>/media/hdd</strong><code>Festplatte</code></button>
      <button class="folder" onclick="selectPath('/media/usb')"><div class="icon">📁</div><strong>/media/usb</strong><code>USB</code></button>
      <button class="folder" onclick="selectPath('/etc/network')"><div class="icon">📁</div><strong>/etc/network</strong><code>Netzwerk</code></button>
    </div>
  </section>
</main>

<nav class="bottom"><div class="nav">
  <button class="active"><span class="ni">⌂</span>Start</button>
  <button onclick="location.hash='files'"><span class="ni">□</span>Dateien</button>
  <button onclick="toast('Backups werden später hier angezeigt')"><span class="ni">◷</span>Backups</button>
  <button onclick="openSettings()"><span class="ni">☰</span>Mehr</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet"><h2>GigaBlue Verbindung</h2><input class="input" id="ip" placeholder="IP-Adresse, z. B. 192.168.178.50"><input class="input" id="name" placeholder="Receivername, z. B. Trio 4K"><input class="input" id="version" placeholder="Software, z. B. OpenATV 8.0"><div class="actions"><button class="btn" onclick="closeSettings()">Abbrechen</button><button class="btn" style="background:#168ef0;border-color:#168ef0" onclick="saveSettings()">Speichern</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function openSettings(){ $('ip').value=localStorage.gbIp||''; $('name').value=localStorage.gbName||'Trio 4K'; $('version').value=localStorage.gbVersion||'OpenATV / Enigma2'; $('modal').classList.add('show') }
function closeSettings(){ $('modal').classList.remove('show') }
function saveSettings(){localStorage.gbIp=$('ip').value;localStorage.gbName=$('name').value;localStorage.gbVersion=$('version').value; update();closeSettings();toast('Verbindung gespeichert')}
function update(){ $('receiverIp').textContent='IP: '+(localStorage.gbIp||'nicht konfiguriert');$('receiverName').textContent=localStorage.gbName||'Trio 4K';$('receiverVersion').textContent=localStorage.gbVersion||'OpenATV / Enigma2'}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function selectPath(p){toast('Ordner ausgewählt: '+p)}
update();
</script>
</body></html>
