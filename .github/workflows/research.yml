name: Tägliche Forschungsrecherche

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    name: Recherche und deutsche Zusammenfassung
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recherche starten
        env:
          GEMINI_API_KEY: ${{ secrets.FORSCHUNGSMONITOR }}
        run: python fetch_news.py

      - name: Ergebnisse speichern
        run: |
          git config user.name "Forschungsmonitor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/archive/
          if git diff --cached --quiet; then
            echo "Keine neuen Änderungen."
          else
            git commit -m "Automatische Forschungsrecherche"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
