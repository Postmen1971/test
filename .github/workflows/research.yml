name: Tägliche Forschungsrecherche

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: taegliche-forschungsrecherche-main
  cancel-in-progress: false

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    name: Recherche, Übersetzung und vollständiger Refresh
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recherche komplett neu aufbauen
        env:
          GEMINI_API_KEY: ${{ secrets.FORSCHUNGSMONITOR }}
        run: |
          set -e
          # Ein Lauf baut news.json vollständig neu auf. Es wird nicht nur eine neue Meldung ergänzt.
          python fetch_news.py
          # Danach werden alle erzeugten Meldungen nochmals auf Deutsch geprüft.
          python fix_news.py

      - name: Ergebnisse speichern
        run: |
          set -e
          git config user.name "Forschungsmonitor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/archive/
          git add fix_news.py .github/workflows/research.yml
          git diff --cached --quiet && echo "Keine Änderungen." && exit 0
          git commit -m "Forschungsmonitor vollständig aktualisieren"

          # Kein zweiter Forschungsdurchlauf: Bei einem zwischenzeitlichen Push wird nur
          # der Commit auf den aktuellen main-Stand gesetzt. Die Recherche selbst läuft pro
          # Workflow höchstens einmal.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Vollständiger Forschungsmonitor erfolgreich gespeichert."
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase-Konflikt; neuer Workflow-Versuch wird benötigt."
            fi
            sleep 5
          done
          echo "Konnte Ergebnisse nicht speichern."
          exit 1
